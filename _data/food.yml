# ============================================================
# LA Food — restaurant database for /fun/food/
#
# To add a place: pick a category, add an entry. Cards are
# automatically sorted by Google rating (highest first).
#
# Fields:
#   name   — restaurant name
#   emoji  — stands in for the photo until you add one at
#            Photos/Food/<slugified-name>.jpg (hover a card
#            banner on the site to see the exact filename)
#   dish   — the famous thing to order
#   google — Google Maps rating   (snapshot: July 2026)
#   yelp   — Yelp rating          (snapshot: July 2026)
#   price  — $ … $$$$ (Google Maps convention)
#   area   — neighborhood / local area shown on the card
#   city   — city used to build the Google Maps / Yelp links
#   style  — specific style (cafe, bar, seafood, bakery, …)
#   note   — optional extra line (awards, tips, …)
# ============================================================

